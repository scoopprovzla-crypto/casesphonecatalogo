
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f2; --card:#fff; --text:#0a0a0a; --muted:#6b7068; --line:#e6e7e2;
    --brand:#06B5A8; --brand-dark:#05978c; --brand-ink:#0f766e; --brand-soft:#e7faf7; --ink:#0a0a0a;
    --red:#dc2626; --amber:#b45309; --amber-soft:#fef3c7;
    --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
  button,input,select,textarea{font-family:inherit;font-size:15px}
  svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
  .head-in{max-width:1180px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
  .head-in img{height:42px;display:block}
  .head-in .spacer{flex:1}
  .head-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;position:relative}
  .head-btn:hover{background:rgba(255,255,255,.14)}
  .head-btn.cart{background:var(--brand);color:var(--ink)}
  .head-btn.cart:hover{background:var(--brand-dark)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand);background:rgba(6,181,168,.12);padding:4px 10px;border-radius:20px}
  .live[hidden]{display:none}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .st.x{background:#f1f1ee;color:var(--muted)}
  .badge-n{background:var(--ink);color:var(--brand);border-radius:10px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
  .hero{background:linear-gradient(135deg,#0a0a0a 0%,#062b28 100%);color:#fff}
  .hero-in{max-width:1180px;margin:0 auto;padding:34px 18px 40px;display:flex;align-items:center;gap:24px}
  .hero h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-style:italic}
  .hero h1 span{color:var(--brand)}
  .hero p{color:#b5cfcb;margin-top:8px;max-width:520px}
  .hero-mark{height:150px;margin-left:auto}

  main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .search{position:relative;flex:1;min-width:220px;max-width:360px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(6,181,168,.25)}
  .search .input{padding-left:40px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 15px;font-weight:600;cursor:pointer;font-size:14px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .prod{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
  .prod-img{aspect-ratio:1/1;background:linear-gradient(135deg,#121212,#0b2f2b);display:grid;place-items:center;position:relative;overflow:hidden}
  .prod-img img.photo{width:100%;height:100%;object-fit:cover}
  .prod-img .ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
  .prod-img .ph img{height:54px;opacity:.9}
  .prod-img .ph span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#b5cfcb;font-weight:700}
  .tag{position:absolute;top:10px;left:10px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
  .tag.low{background:var(--amber-soft);color:var(--amber)}
  .tag.out{background:#fee2e2;color:var(--red)}
  .prod-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .prod-brand{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .prod-name{font-weight:700;font-size:15.5px;line-height:1.3}
  .prod-var{font-size:13px;color:var(--muted)}
  .prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;gap:8px}
  .price{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-primary{background:var(--brand);color:var(--ink)}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
  .btn-wa{background:#25D366;color:#fff}
  .btn-wa:hover{background:#1ebe5a}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-block{width:100%;padding:15px;font-size:16px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stepper button{border:none;background:none;width:36px;height:38px;cursor:pointer;font-size:18px;font-weight:700}
  .stepper button:hover{background:var(--brand-soft)}
  .stepper span{min-width:28px;text-align:center;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}

  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;background:#fff;z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-size:19px;font-weight:800}
  .x{background:none;border:none;cursor:pointer;padding:6px;border-radius:10px;color:var(--muted)}
  .x:hover{background:var(--bg)}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line);background:#fafaf8}
  .line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .line-info{flex:1;min-width:0}
  .line-info b{display:block;font-size:14.5px}
  .line-info small{color:var(--muted)}
  .line-total{font-weight:800;min-width:70px;text-align:right}
  .sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .sum span{color:var(--muted);font-weight:600}
  .sum b{font-size:24px;font-weight:800}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
  .field label i{color:var(--red);font-style:normal}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;gap:8px}
  .seg label{flex:1}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
  .seg input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 4px}
  .consent input{margin-top:3px;accent-color:var(--brand-dark);width:16px;height:16px}
  .note{background:var(--brand-soft);color:var(--brand-ink);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:500;margin-bottom:14px;display:flex;gap:10px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:#eef0ea;border-radius:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
  .doc{background:#fff;margin:18px;padding:24px 22px;border-radius:8px;font-size:13.5px;position:relative}
  .doc-head{text-align:center;padding-bottom:12px;border-bottom:2px dashed #d4d7cd}
  .doc-head img{height:68px;margin:0 auto 6px;display:block}
  .doc-head p{color:var(--muted);font-size:12px}
  .doc-title{display:inline-block;margin-top:10px;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.06em}
  .doc-meta{padding:10px 0;border-bottom:2px dashed #d4d7cd;display:grid;gap:3px}
  .doc-meta div,.doc-line{display:flex;justify-content:space-between;gap:10px}
  .doc-meta span{color:var(--muted)}
  .doc table{width:100%;border-collapse:collapse;margin:8px 0}
  .doc th{font-size:10.5px;color:var(--muted);text-transform:uppercase;padding:6px 0;border-bottom:1px solid #e5e7e0;text-align:left}
  .doc td{padding:7px 0;border-bottom:1px dotted #e5e7e0;vertical-align:top}
  .doc .r{text-align:right;white-space:nowrap;width:82px} .doc .c{text-align:center;width:46px}
  a.btn{text-decoration:none}
  .doc-total{display:flex;justify-content:space-between;border-top:2px dashed #d4d7cd;padding-top:10px;margin-top:6px;font-size:18px;font-weight:800}
  .doc-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  .stamp{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--ink);font-weight:800;padding:6px 14px;border-radius:30px;margin-top:10px;font-size:13px}
  .pending{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:var(--amber);font-weight:800;padding:6px 14px;border-radius:30px;margin-top:10px;font-size:13px}
  .modal-actions{display:flex;flex-direction:column;gap:10px;padding:0 18px 18px}
  .success{text-align:center;padding:24px 22px 6px}
  .success .ic{width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--ink);display:grid;place-items:center;margin:0 auto 12px}
  .success .ic svg{width:32px;height:32px}
  .success h3{font-size:20px;font-weight:800}
  .success p{color:var(--muted);font-size:14px;margin-top:4px}

  .order-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}
  .order-card:hover{border-color:var(--brand)}
  .order-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .st.p{background:var(--amber-soft);color:var(--amber)}
  .st.ok{background:var(--brand-soft);color:var(--brand-ink)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:90;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast svg{color:var(--brand)}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 18px 40px}
  footer a{color:var(--brand-ink);font-weight:700}

  @media (max-width:640px){
    .hero-in{padding:24px 18px 28px}
    .hero h1{font-size:26px}
    .hero-mark{height:84px}
    .head-btn .lbl{display:none}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .prod-body{padding:10px 12px 12px}
    .prod-name{font-size:14px}
    .price{font-size:17px}
    .prod-foot{flex-direction:column;align-items:stretch}
    .prod-foot .btn,.prod-foot .stepper{width:100%;justify-content:space-between}
    .prod-foot .btn{justify-content:center}
    .row{grid-template-columns:1fr}
  }
  /* ---- Arma tu stack ---- */
  .stack-band{max-width:1180px;margin:22px auto 0;padding:0 18px}
  .stack-band[hidden]{display:none}
  .sb-card{background:linear-gradient(120deg,#0a0a0a 0%,#082f2b 60%,#0b4a43 100%);color:#fff;border-radius:22px;padding:24px;display:grid;grid-template-columns:1.1fr 1.4fr;gap:22px;align-items:center;position:relative;overflow:hidden}
  .sb-card::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(6,181,168,.35),transparent 70%)}
  .sb-kicker{display:inline-flex;gap:6px;align-items:center;background:rgba(6,181,168,.15);color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px}
  .sb-card h2{font-size:28px;font-weight:800;font-style:italic;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.1}
  .sb-card h2 span{color:var(--brand)}
  .sb-card p{color:#b5cfcb;font-size:14px;margin-bottom:14px}
  .sb-goals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:relative;z-index:1}
  .sb-goal{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;text-align:left;color:#fff}
  .sb-goal:hover{background:rgba(6,181,168,.14);border-color:var(--brand);transform:translateY(-2px)}
  .sb-goal .em{font-size:24px}
  .sb-goal b{display:block;font-size:14.5px;margin-top:4px}
  .sb-goal small{color:#b5cfcb;font-size:12px}
  .sb-goal .off{display:inline-block;margin-top:6px;background:var(--brand);color:var(--ink);font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
  .quiz{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
  .qz-head{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
  .qz-prog{flex:1;display:flex;gap:6px}
  .qz-prog i{flex:1;height:6px;border-radius:4px;background:#eceee6}
  .qz-prog i.on{background:var(--brand)}
  .qz-body{padding:16px 20px 22px}
  .qz-body h3{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
  .qz-body .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .qz-opts{display:grid;gap:10px}
  .qz-opt{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;background:#fff;text-align:left;transition:.12s;width:100%}
  .qz-opt:hover{border-color:var(--brand);background:var(--brand-soft)}
  .qz-opt .em{font-size:26px;width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}
  .qz-opt b{display:block;font-size:15.5px}
  .qz-opt small{color:var(--muted);font-size:13px}
  .qz-opt .rt{margin-left:auto;text-align:right;white-space:nowrap}
  .qz-opt .rt b{font-size:16px}
  .qz-opt .pop{display:inline-block;background:var(--brand);color:var(--ink);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
  .qz-res-head{background:linear-gradient(120deg,#0a0a0a,#0c3d37);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .qz-res-head small{color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .qz-res-head h3{color:#fff;margin:4px 0}
  .qz-res-head p{color:#b5cfcb;font-size:13px}
  .qz-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .qz-item .th{width:58px;height:58px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#121212,#0b2f2b);display:grid;place-items:center;flex-shrink:0}
  .qz-item .th img{width:100%;height:100%;object-fit:cover}
  .qz-item .th img.mk{width:30px;height:30px;object-fit:contain}
  .qz-item .in{flex:1;min-width:0}
  .qz-item .in b{display:block;font-size:14px}
  .qz-item .in small{color:var(--muted);font-size:12.5px;display:block}
  .tier{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:8px;margin-bottom:2px}
  .tier.esencial{background:var(--brand);color:var(--ink)} .tier.recomendado{background:#e0ecff;color:#1d4ed8} .tier.extra{background:#f1f1ee;color:var(--muted)}
  .qz-sum{background:var(--bg);border-radius:14px;padding:12px 14px;margin:14px 0}
  .qz-sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
  .qz-sum .save{color:var(--brand-ink);font-weight:700}
  .qz-sum .tot{font-size:20px;font-weight:800;border-top:1px dashed #d4d7cd;margin-top:6px;padding-top:8px}
  .strike{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:.85em;margin-right:4px}
  .disclaimer{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}
  .stk-tag{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;margin-top:2px}
  .tag.off{background:var(--red);color:#fff;left:auto;right:10px}
  .tag.low+.tag.off,.tag.out+.tag.off{top:10px}
  .cd{display:block;font-size:11.5px;font-weight:700;color:var(--red);margin-top:2px}
  .bs{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
  .idx{margin-bottom:22px}
  .idx-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .idx-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .idx-head small{color:var(--muted);font-weight:600;font-size:13px}
  .idx-group{margin-bottom:12px}
  .idx-group>b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .idx-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .idx-t{flex:0 0 auto;text-align:left;color:var(--text);display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 13px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
  .idx-t .e{font-size:20px;line-height:1}
  .idx-t small{color:var(--muted);font-weight:600;font-size:12px}
  .idx-t:hover{border-color:var(--brand)}
  .idx-t.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .idx-t.on small{color:var(--brand)}
  .active-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 16px;font-size:14px}
  .active-f h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .active-f button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}
  .chip.hot{border-color:#fecaca;color:var(--red)}
  .chip.hot.on{background:var(--red);border-color:var(--red);color:#fff}
  .combos{margin-bottom:26px}
  .combos h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  .cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .cb{background:linear-gradient(135deg,#0a0a0a,#2a1608);color:#fff;border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .cb .em{font-size:30px;line-height:1}
  .cb h3{font-size:18px;font-weight:800}
  .cb p{color:#d6d3cc;font-size:13px}
  .cb ul{list-style:none;font-size:13.5px;color:#eee}
  .cb ul li::before{content:'✓ ';color:var(--brand)}
  .cb .cb-save{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-weight:800;font-size:12px;border-radius:20px;padding:4px 10px}
  .cb .cb-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
  .cb .cb-price b{font-size:24px;font-weight:800;color:var(--brand)}
  .cb .strike{color:#a8a29e}
  .cb .cd{color:#fca5a5}
  .cb .bs{color:#b5cfcb}
  .price-note{display:flex;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:-6px 0 18px;font-size:13px;color:var(--muted)}
  .price-note b{color:var(--text)}
  .pay-opts{display:grid;gap:8px;margin-bottom:12px}
  .pay-opt{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pay-opt b{font-size:17px;color:var(--text);white-space:nowrap}
  .pay-opt.hi{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);outline:2px solid var(--brand)}
  .mrw-note{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  .seg{flex-wrap:wrap}
  .bs-box{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--brand-ink)}
  .bs-box b{font-size:17px;display:block;color:var(--text)}
  .bs-box.hi{background:#fef9c3;color:#854d0e;outline:2px solid #facc15}
  @media (max-width:760px){ .sb-card{grid-template-columns:1fr;padding:20px} .sb-card h2{font-size:23px} }
  @media (max-width:480px){ .head-in{gap:8px;padding:12px} .head-in img{height:34px} .live{font-size:0;gap:0;padding:6px} .head-btn{padding:9px 10px} }
  @media (max-width:420px){ .sb-goals{grid-template-columns:1fr 1fr;gap:8px} .sb-goal{padding:11px} }
  @media print{
    body *{visibility:hidden}
    .print-me,.print-me *{visibility:visible}
    .print-me{position:absolute;left:0;top:0;width:100%;margin:0;max-width:80mm}
  }
</style>

function waOrderText(o, live) {
  const c = o.client, L = [];
  const line = i => r2(i.q * i.p * (1 - (i.d || 0) / 100));
  L.push(`🛒 *Pedido ${o.id}* · ${DATA.biz.name}`, '');
  L.push(`Nombre: ${c.name}`, `Teléfono: ${c.phone}`);
  const extra = [c.doc && `Cédula: ${c.doc}`, c.email && `Email: ${c.email}`, c.ig && `Instagram: ${c.ig}`].filter(Boolean);
  if (extra.length) L.push(extra.join(' · '));
  if (o.del === 'Envío MRW') L.push(`Entrega: 📦 Envío MRW – ${o.addr.replace(/\s*·\s*/g, ' – ')}`, `Pago: ${o.pay}`, '');
  else L.push(`Entrega: ${o.del}${o.del === 'Delivery' && o.addr ? ' – ' + o.addr.replace(/\s*[·\n]+\s*/g, ', ') : ''} · Pago: ${o.pay}`, '');
  o.items.forEach(i => L.push(`• ${i.q} × ${i.n} – ${money(line(i))}`));
  const saved = r2(o.items.reduce((s, i) => s + i.q * i.p, 0) - o.total);
  if (saved > 0.009) L.push(`🔥 Ahorro combo/kit: −${money(saved)}`);
  const bsTot = o.rate ? Number(o.total * o.rate).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
  if (o.rate && paysInBs(o.pay)) L.push('', `*TOTAL: ${money(o.total)}* (precio para pago en Bs)`, `*A pagar en Bs: ${bsTot}* (tasa BCV ${fmtRate(o.rate)})`);
  else L.push('', `*TOTAL: ${money(o.total)}* en divisas`);
  if (o.note) L.push(`Comentario: ${o.note.replace(/\n+/g, ' ')}`);
  L.push('', 'Quedo atento(a) a los datos de pago. ¡Gracias!');
  return L.join('\n');
}

const newToken = () => Array.from(crypto.getRandomValues(new Uint8Array(15)), x => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 56]).join('');
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

function sendOrder(ev) {
  ev.preventDefault();
  const f = new FormData($('ck'));
  const g = k => (f.get(k) || '').toString().trim();
  const client = { name: g('name'), phone: g('phone'), doc: g('doc'), email: g('email'), ig: g('ig') };
  if (client.phone.replace(/\D/g, '').length < 7) { toast('Revisa tu número de teléfono'); return false; }
  if (!cart.length) { toast('Tu carrito está vacío'); return false; }
  const now = new Date();
  const id = 'CP-' + String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '-' + String(Math.floor(1000 + Math.random() * 9000));
  const inBs = !!fxR() && paysInBs(g('pay'));
  const items = cart.map(i => { const p = byCode(i.c); const d = lineDisc(i); const pr = inBs ? (p.pbN ?? p.p) : p.p; return d ? { c: p.c, n: fullName(p), q: i.q, p: pr, d } : { c: p.c, n: fullName(p), q: i.q, p: pr }; });
  const total = inBs ? cartTotalBs() : cartTotal();
  const del = g('del');
  const mrw = { st: g('mrwState'), ci: g('mrwCity'), of: g('mrwOffice') };
  if (del === 'Envío MRW' && client.doc.replace(/\D/g, '').length < 5) { toast('Para el envío por MRW necesitamos tu cédula'); return false; }
  const addr = del === 'Delivery' ? g('addr') : del === 'Envío MRW' ? `${mrw.st}, ${mrw.ci} · Oficina MRW: ${mrw.of}`.slice(0, 290) : '';
  const o = { id, date: now.toISOString(), client, del, addr, pay: g('pay'), note: g('note'), items, total, status: 'pendiente', rate: bsRate() || 0 };

  const btn = document.querySelector('button[form=ck]');
  if (btn) { btn.disabled = true; btn.lastChild.textContent = ' Enviando pedido…'; }
  const win = window.open('', '_blank');           // se abre ya para que el navegador no lo bloquee

  const finish = live => {
    o.wa = `https://wa.me/${DATA.biz.whatsapp}?text=${encodeURIComponent(waOrderText(o, live))}`;
    const orders = store.get('orders', []); orders.unshift(o); store.set('orders', orders);
    store.set('me', { ...client, del: o.del, addr: del === 'Delivery' ? o.addr : (store.get('me', {}).addr || ''), pay: o.pay, mrw: del === 'Envío MRW' ? mrw : store.get('me', {}).mrw });
    cart = []; store.set('cart', cart); store.set('stackMeta', {}); $('cart-n').textContent = 0;
    closeDrawer(); renderGrid();
    if (win && !win.closed) win.location.href = o.wa; else window.open(o.wa, '_blank');
    showOrder(o, true);
    watchMyOrder(o);
  };

  if (cloudReady) {
    o.cloudId = newToken();
    const payload = { number: id, date: o.date, client, del: o.del, addr: o.addr, pay: o.pay, note: o.note, items, total, status: 'pendiente' };   // (la tasa no viaja: el sistema usa la del día)
    withTimeout(Cloud.createOrder(o.cloudId, payload), 9000)
      .then(() => finish(true))
      .catch(err => { console.warn('No se pudo guardar el pedido en la nube', err); delete o.cloudId; finish(false); });   // sin conexión: el pedido viaja con su código por WhatsApp
  } else finish(false);
  return false;
}

/* Estado de mis pedidos en tiempo real */
function watchMyOrder(o) {
  if (!cloudReady || !o.cloudId || watchers[o.cloudId]) return;
  watchers[o.cloudId] = Cloud.watchOrder(o.cloudId, d => {
    const orders = store.get('orders', []);
    const x = orders.find(y => y.cloudId === o.cloudId);
    if (!x) return;
    const was = x.status;
    Object.assign(x, { status: d.status || x.status, saleNum: d.saleNum || x.saleNum, paidAt: d.paidAt || x.paidAt, pay: d.payment || x.pay, total: d.total ?? x.total });
    store.set('orders', orders);
    if (was !== 'pagado' && x.status === 'pagado') toast(`¡Tu pago del pedido ${x.id} fue confirmado!`);
    if (view === 'orders' && $('drawer').classList.contains('open')) openOrders();
  }, () => {});
}

// Enlace de confirmación enviado por la tienda: ...#ok=CODIGO
function checkConfirmation() {
  const m = location.hash.match(/ok=([A-Za-z0-9_-]+)/);
  if (!m) return;
  let c;
  try { c = dec(m[1]); } catch (e) { return; }
  const orders = store.get('orders', []);
  let o = orders.find(x => x.id === c.i);
  const paidData = { status: 'pagado', saleNum: c.s, total: c.t, pay: c.m, paidAt: c.d, discount: c.ds || 0,
    items: c.it.map(([n, q, p]) => ({ n, q, p })) };
  if (o) Object.assign(o, paidData);
  else { o = { id: c.i, date: c.d, client: { name: c.c }, del: '', ...paidData }; orders.unshift(o); }
  store.set('orders', orders);
  history.replaceState(null, '', location.pathname + location.search);
  showOrder(o);
}

const LEVELS = [
  { id: 'ini', e: '🙂', n: 'Uso básico', d: 'Llamadas, chats y redes sociales', tip: 'Con una buena funda y un vidrio templado tu teléfono queda protegido para el día a día.' },
  { id: 'mid', e: '🔥', n: 'Uso intensivo', d: 'Lo uso todo el día, fuera de casa', tip: 'Lleva siempre carga contigo y protege bien la pantalla: es lo primero que sufre en una caída.' },
  { id: 'adv', e: '🎬', n: 'Trabajo o contenido', d: 'Fotos, video, trabajo y viajes', tip: 'Protege la cámara, ten carga rápida a mano y un buen soporte para grabar o manejar.' },
];
const BUDGETS = [
  { id: 'esencial', e: '🎯', n: 'Lo esencial', d: 'Lo básico para empezar', tiers: ['esencial'] },
  { id: 'recomendado', e: '⭐', n: 'Recomendado', d: 'El equilibrio ideal', tiers: ['esencial', 'recomendado'], pop: true },
  { id: 'completo', e: '🚀', n: 'Completo', d: 'Todo lo que tu teléfono necesita', tiers: ['esencial', 'recomendado', 'extra'] },
];
let QZ = { step: 1, goal: null, level: null, budget: null };
const stacksAvail = () => (DATA.stacks || []).map(st => ({ ...st, items: st.items.filter(i => byCode(i.c) && byCode(i.c).s > 0) })).filter(st => st.items.length);
function stackPick(st, budgetId) {
  const b = BUDGETS.find(x => x.id === budgetId) || BUDGETS[1];
  let list = st.items.filter(i => b.tiers.includes(i.t));
  if (!list.length) list = st.items.slice(0, 2);
  return list;
}
function stackPrice(st, items) {
  const full = r2(items.reduce((s, i) => s + byCode(i.c).p, 0));
  const tot = r2(items.reduce((s, i) => s + byCode(i.c).p * (1 - st.pct / 100), 0));
  return { full, tot, save: r2(full - tot) };
}
function renderStackBand() {
  const S = stacksAvail();
  $('stack-band').hidden = !S.length;
  $('sb-goals').innerHTML = S.slice(0, 4).map(st => `<button class="sb-goal" onclick="startQuiz('${esc(st.id)}')"><span class="em">${esc(st.e)}</span><b>${esc(st.n)}</b><small>${st.items.length} productos</small>${st.pct ? `<br><span class="off">−${st.pct}% en kit</span>` : ''}</button>`).join('');
}
function startQuiz(goalId) {
  QZ = { step: goalId ? 2 : 1, goal: goalId || null, level: null, budget: null };
  renderQuiz();
  $('modal').classList.add('open');
}
function qzBack() { QZ.step = Math.max(1, QZ.step - 1); renderQuiz(); }
function qzSet(k, v) { QZ[k] = v; QZ.step++; renderQuiz(); }
function renderQuiz() {
  const S = stacksAvail();
  const st = S.find(x => x.id === QZ.goal);
  const prog = [1, 2, 3, 4].map(n => `<i class="${n <= QZ.step ? 'on' : ''}"></i>`).join('');
  const head = `<div class="qz-head">${QZ.step > 1 ? `<button class="x" onclick="qzBack()" title="Atrás"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>` : ''}
    <div class="qz-prog">${prog}</div><button class="x" onclick="closeModal()"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
  let body = '';
  if (QZ.step === 1 || !st) {
    QZ.step = 1;
    body = `<h3>¿Qué necesitas para tu teléfono?</h3><p class="sub">Elige lo que más se parece a lo que buscas.</p>
      <div class="qz-opts">${S.map(x => `<button class="qz-opt" onclick="qzSet('goal','${esc(x.id)}')"><span class="em">${esc(x.e)}</span><div><b>${esc(x.n)}</b><small>${esc(x.d)}</small></div></button>`).join('')}</div>`;
  } else if (QZ.step === 2) {
    body = `<h3>¿Cómo usas tu teléfono?</h3><p class="sub">Así ajustamos la recomendación a tu día a día.</p>
      <div class="qz-opts">${LEVELS.map(x => `<button class="qz-opt" onclick="qzSet('level','${x.id}')"><span class="em">${x.e}</span><div><b>${x.n}</b><small>${x.d}</small></div></button>`).join('')}</div>`;
  } else if (QZ.step === 3) {
    body = `<h3>¿Qué tan completo lo quieres?</h3><p class="sub">Precios con el descuento del kit incluido.</p>
      <div class="qz-opts">${BUDGETS.map(b => { const items = stackPick(st, b.id); const pr = stackPrice(st, items);
        return `<button class="qz-opt" onclick="qzSet('budget','${b.id}')"><span class="em">${b.e}</span><div><b>${b.n}${b.pop ? '<span class="pop">MÁS ELEGIDO</span>' : ''}</b><small>${b.d} · ${items.length} producto${items.length === 1 ? '' : 's'}</small></div>
          <div class="rt">${pr.save ? `<span class="strike">${money(pr.full)}</span><br>` : ''}<b>${money(pr.tot)}</b></div></button>`; }).join('')}</div>`;
  } else {
    const lv = LEVELS.find(x => x.id === QZ.level) || LEVELS[0];
    const items = stackPick(st, QZ.budget), pr = stackPrice(st, items);
    const missing = (DATA.stacks.find(x => x.id === st.id)?.items || []).filter(i => !(byCode(i.c)?.s > 0) && BUDGETS.find(b => b.id === QZ.budget)?.tiers.includes(i.t));
    body = `<div class="qz-res-head"><small>Tu kit recomendado</small><h3>${esc(st.e)} ${esc(st.n)}</h3><p>${esc(lv.tip)}</p></div>
      ${items.map(i => { const p = byCode(i.c); const src = p.img || IMAGES[p.c] || '';
        return `<div class="qz-item"><div class="th">${src ? `<img src="${esc(src)}" alt="">` : DATA.mark ? `<img class="mk" src="${DATA.mark}" alt="">` : ''}</div>
          <div class="in"><span class="tier ${esc(i.t)}">${esc(i.t)}</span><b>${esc(fullName(p))}</b>${i.w ? `<small>${esc(i.w)}</small>` : ''}</div>
          <div style="text-align:right;white-space:nowrap">${st.pct ? `<span class="strike">${money(p.p)}</span><br>` : ''}<b>${money(r2(p.p * (1 - st.pct / 100)))}</b></div></div>`; }).join('')}
      ${missing.length ? `<p class="disclaimer" style="text-align:left">No disponible ahora: ${missing.map(i => esc(byCode(i.c)?.n || i.c)).join(', ')}</p>` : ''}
      <div class="qz-sum">
        <div><span>Precio normal</span><span>${money(pr.full)}</span></div>
        ${pr.save ? `<div class="save"><span>Descuento kit (−${st.pct}%)</span><span>−${money(pr.save)}</span></div>` : ''}
        <div class="tot"><span>Total</span><span>${money(pr.tot)}</span></div>
        ${fxR() ? `<div><span>En bolívares</span><span>${bs(pr.tot * bsRatio(items.map(i => [i.c, 1])))}</span></div>` : ''}
      </div>
      <button class="btn btn-primary btn-block" onclick="addStackToCart()">Agregar mi kit al carrito (${items.length})</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="QZ.step=1;renderQuiz()">Probar otra opción</button>
      <p class="disclaimer">Antes de comprar, verifica que los accesorios sean compatibles con el modelo de tu teléfono. Si tienes dudas, escríbenos por WhatsApp y te ayudamos.</p>`;
  }
  $('modal-box').className = 'quiz';
  $('modal-box').innerHTML = head + `<div class="qz-body">${body}</div>`;
}
function addStackToCart() {
  const st = stacksAvail().find(x => x.id === QZ.goal);
  if (!st) return;
  const items = stackPick(st, QZ.budget);
  for (const i of items) {
    const p = byCode(i.c), line = cart.find(x => x.c === i.c);
    if ((line?.q || 0) + 1 > p.s) { toast(`No hay suficiente stock de ${p.n}`); return; }
    if (line && line.s && line.s.startsWith('cb:')) { toast(`${p.n} ya está en un combo de tu carrito`); return; }
  }
  const meta = store.get('stackMeta', {});
  // un stack por objetivo: si ya existe, se suma una unidad más del combo
  for (const i of items) {
    let line = cart.find(x => x.c === i.c);
    if (!line) { line = { c: i.c, q: 0 }; cart.push(line); }
    if (line.s && line.s !== st.id) { line.q += 1; continue; }
    line.q += 1; line.s = st.id; line.d = st.pct; line.sq = (line.sq || 0) + 1;
  }
  meta[st.id] = [...new Set([...(meta[st.id] || []), ...items.map(i => i.c)].filter(c => cart.some(x => x.c === c && x.s === st.id)))];
  store.set('stackMeta', meta);
  saveCart(); renderGrid();
  closeModal();
  toast(`Kit agregado${st.pct ? ` · ahorras ${money(stackPrice(st, items).save)}` : ''}`);
  openCart();
}

/* Catálogo en vivo: cuando la tienda edita algo en su sistema, se actualiza aquí */
let IMAGES = {};
function applyImages(list) {
  IMAGES = {};
  list.forEach(x => { if (x && typeof x.img === 'string' && x.img.startsWith('data:image/')) IMAGES[x.id] = x.img; });
  renderGrid();
}
function applyCatalog(d) {
  if (!d || !Array.isArray(d.products)) return;
  DATA.biz = { ...DATA.biz, ...(d.biz || {}) };
  DATA.cats = d.cats || DATA.cats; DATA.pays = d.pays || DATA.pays; DATA.products = d.products;
  DATA.stacks = d.stacks || [];
  DATA.combos = d.combos || []; if (d.fx && !(DATA.fx && DATA.fx.d > d.fx.d)) DATA.fx = d.fx; if (d.paysBs) DATA.paysBs = d.paysBs;
  normalize();
  if (d.generated) DATA.generated = d.generated;
  cart = cart.filter(i => byCode(i.c) && byCode(i.c).s > 0).map(i => ({ ...i, q: Math.min(i.q, byCode(i.c).s) }));
  // si cambió el descuento del stack, se actualiza en el carrito
  cart.forEach(i => { if (!i.s) return;
    if (i.s.startsWith('cb:')) { const c = combosAvail().find(x => 'cb:' + x.id === i.s); if (!c) { delete i.s; delete i.d; delete i.sq; } else i.d = Math.round(comboPct(c) * 10000) / 10000; return; }
    const st = DATA.stacks.find(x => x.id === i.s); if (!st) { delete i.s; delete i.d; delete i.sq; } else i.d = st.pct; });
  checkStacks(); saveCart();
  renderHeader(); renderGrid(); renderLoyaltyUI();
  if ($('drawer').classList.contains('open') && view === 'cart') renderCart();
}
function startCloud() {
  if (!DATA.cloud) return;
  Cloud.start(DATA.cloud).then(() => {
    cloudReady = true;
    $('live').hidden = false;
    renderLoyaltyUI();
    Cloud.watchCatalog(applyCatalog, () => { $('live').hidden = true; });
    if (Cloud.watchImages) Cloud.watchImages(applyImages, () => {});
    store.get('orders', []).forEach(watchMyOrder);
  }).catch(() => {});
}

function renderLoyaltyUI() { renderStackBand(); }
/* Tasa BCV en vivo: el catálogo consulta la tasa oficial del día (si la tienda no usa una tasa manual) */
async function liveFx() {
  if (DATA.fx && DATA.fx.auto === false) return;
  try {
    const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial', { cache: 'no-store' });
    const j = await res.json(), v = +j.promedio || +j.venta || +j.compra;
    if (!(v > 0 && v < 1e7)) return;
    const d = String(j.fechaActualizacion || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
    if (DATA.fx && Math.abs(DATA.fx.r - v) < 0.00005 && DATA.fx.d === d) return;
    DATA.fx = { r: Math.round(v * 10000) / 10000, d, auto: true };
    renderGrid();
    if ($('drawer').classList.contains('open')) { if (view === 'cart') renderCart(); else if (view === 'checkout') renderCheckoutSum(); }
  } catch (e) {}
}
normalize();
renderHeader();
renderGrid();
renderLoyaltyUI();
$('cart-n').textContent = cart.reduce((s, i) => s + i.q, 0);
checkConfirmation();
startCloud();
window.addEventListener('hashchange', checkConfirmation);
tickOffers(); setInterval(tickOffers, 30000);
liveFx(); setInterval(liveFx, 20 * 60e3);
</script>
